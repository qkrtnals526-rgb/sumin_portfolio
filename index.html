<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARK SUMiN — Portfolio</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
@font-face {
  font-family:'StackSansNotch';
  src:url('StackSansNotch-VariableFont_wght.ttf') format('truetype');
  font-weight:100 900;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:#000;overflow-x:hidden;}

/* COVER NAME TILT + SCROLL */

/* CURSOR TRAIL */
#sphereCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:998;}

/* NAV */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:999;
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 40px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.nav-datetime{font-family:'StackSansNotch',sans-serif;font-weight:300;font-size:22px;letter-spacing:0.04em;color:#000;transition:color 0.4s;white-space:nowrap;}
.nav-right{display:flex;align-items:center;gap:40px;}
.nav-portfolio{font-size:22px;font-weight:700;color:#000;letter-spacing:-0.01em;text-transform:uppercase;transition:color 0.4s;text-decoration:none;}
.nav-links{display:flex;gap:40px;}
.nav-links a{font-size:22px;font-weight:500;text-decoration:none;color:#000;opacity:0.6;transition:opacity 0.2s,color 0.4s;}
.nav-links a:hover{opacity:1;}
#nav.light .nav-datetime,#nav.light .nav-portfolio,#nav.light .nav-links a{color:#fff;}

/* COVER */
#s-cover-wrap{position:relative;height:200vh;}
#s-cover{position:sticky;top:0;width:100%;aspect-ratio:16/9;background:url('cover1.png') center/cover no-repeat;}

/* INTRO — 스크롤시 커버 위로 올라와 덮는 효과 */
#s-cover-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
}
#s-intro{
  position:sticky;
  top:0;
  width:100%;
  aspect-ratio:16/9;
  background:url('intro1.png') center/cover no-repeat;
  overflow:hidden;
  /* 처음엔 화면 아래에 숨겨져 있음 */
  transform:translateY(100%);
  z-index:10;
  will-change:transform;
}
.svg-roll-wrap{position:absolute;left:8%;top:56.8%;height:16.1%;width:39%;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.svg-roll-track{display:flex;flex-direction:column;width:100%;}
.svg-roll-item{display:flex;align-items:center;width:100%;flex-shrink:0;}
.svg-roll-item svg{height:100%;width:auto;display:block;}

/* ABOUT GRADIENT */
#s-about1{
  width:100%;aspect-ratio:1200/531;
  background:linear-gradient(180deg,#1356FC 0%,#0e3de8 12%,#060058 40%,#010018 60%,#000 73%);
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 3.33% 5.5%;position:relative;overflow:hidden;
}
#s-about1::before{content:'';position:absolute;left:-20%;top:0;width:140%;height:70%;background:radial-gradient(ellipse at 50% 40%,rgba(40,80,255,0.3) 0%,transparent 60%);animation:gw 10s ease-in-out infinite alternate;pointer-events:none;}
#s-about1::after{content:'';position:absolute;left:0;top:15%;width:110%;height:50%;background:radial-gradient(ellipse at 40% 55%,rgba(20,60,210,0.18) 0%,transparent 58%);animation:gw 14s ease-in-out 3s infinite alternate-reverse;pointer-events:none;}
.since-text{font-family:'StackSansNotch',sans-serif;font-size:clamp(40px,8.3vw,100px);font-weight:500;color:#fff;letter-spacing:-0.02em;line-height:1;text-transform:uppercase;position:relative;z-index:2;opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(0.16,1,0.3,1),transform 1s cubic-bezier(0.16,1,0.3,1);}
.since-text.in{opacity:1;transform:translateY(0);}
.since-date{font-family:'StackSansNotch',sans-serif;font-size:clamp(14px,2.3vw,28px);font-weight:300;color:#fff;letter-spacing:0.05em;align-self:flex-end;position:relative;z-index:2;opacity:0;transform:translateY(20px);transition:opacity 1s cubic-bezier(0.16,1,0.3,1) 0.18s,transform 1s cubic-bezier(0.16,1,0.3,1) 0.18s;}
.since-date.in{opacity:1;transform:translateY(0);}

/* ABOUT BLACK — image */
#s-about2{width:100%;aspect-ratio:16/9;background:url('about2.png') center/cover no-repeat;display:block;}

/* WORK HEADER */
#s-work1{width:100%;aspect-ratio:1200/480;background:#000;display:flex;align-items:flex-end;justify-content:space-between;padding:0 3.33% 7%;}
.work-title{font-family:'StackSansNotch',sans-serif;font-size:clamp(32px,7.5vw,90px);font-weight:500;color:#fff;letter-spacing:-0.01em;line-height:1;text-transform:uppercase;opacity:0;transform:translateY(30px);transition:opacity 0.9s cubic-bezier(0.16,1,0.3,1),transform 0.9s cubic-bezier(0.16,1,0.3,1);}
.work-title.in{opacity:1;transform:translateY(0);}
.work-preview{font-family:'StackSansNotch',sans-serif;font-size:clamp(14px,2.3vw,28px);font-weight:300;color:#fff;letter-spacing:0.05em;text-transform:uppercase;align-self:flex-end;opacity:0;transform:translateY(20px);transition:opacity 0.9s cubic-bezier(0.16,1,0.3,1) 0.18s,transform 0.9s cubic-bezier(0.16,1,0.3,1) 0.18s;}
.work-preview.in{opacity:1;transform:translateY(0);}

/* WORK CARDS */
#s-work2{width:100%;height:300vh;position:relative;background:#000;}
.work-sticky{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;}
.cards-track-wrap{flex:1;display:flex;align-items:center;overflow:hidden;padding:4vh 3.33% 4vh;}
.cards-track{display:flex;gap:1.5%;will-change:transform;}
.wcard{flex:0 0 26vw;height:72vh;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;background:#111;}
.wcard img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.7s cubic-bezier(0.16,1,0.3,1);}
.wcard:hover img{transform:scale(1.04);}
.wcard-dim{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background 0.4s;z-index:2;border-radius:10px;}
.wcard:hover .wcard-dim{background:rgba(0,0,0,0.55);}
.wcard-info{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;opacity:0;transition:opacity 0.35s;}
.wcard:hover .wcard-info{opacity:1;}
.wcard-info-text{font-family:'StackSansNotch',sans-serif;font-size:clamp(16px,2.2vw,26px);font-weight:700;color:#fff;text-align:center;letter-spacing:0.02em;text-transform:uppercase;line-height:1.2;padding:0 16px;}
.work-footer{padding:0 3.33% 3vh;display:flex;justify-content:flex-end;}
.work-footer p{font-family:'Pretendard',sans-serif;font-size:clamp(8px,1vw,12px);font-weight:400;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.3);}

.sr{opacity:0;transform:translateY(36px);transition:opacity 0.9s cubic-bezier(0.16,1,0.3,1),transform 0.9s cubic-bezier(0.16,1,0.3,1);}
.sr.in{opacity:1;transform:translateY(0);}

@keyframes gw{from{transform:translateX(-4%) translateY(0);}to{transform:translateX(4%) translateY(-18px);}}
</style>
</head>
<body>

<canvas id="sphereCanvas"></canvas>

<nav id="nav">
  <div class="nav-datetime" id="navTime"></div>
  <div class="nav-right">
    <a href="#s-cover" class="nav-portfolio">PORTFOLIO</a>
    <div class="nav-links">
      <a href="#s-about2">About</a>
      <a href="#s-work2">Work</a>
    </div>
  </div>
</nav>

<div id="s-cover-wrap">
  <section id="s-cover"></section>
  <section id="s-intro">
  <div class="svg-roll-wrap">
    <div class="svg-roll-track" id="svgTrack"></div>
  </div>
  </section>
</div>

<section id="s-about1">
  <span class="since-text" id="sinceT">SINCE 1998</span>

</section>

<section id="s-about2"></section>

<section id="s-work1">

  <span class="work-preview" id="workP">PREVIEW</span>
</section>

<section id="s-work2">

        <div class="wcard"><img src="Fashion editorial.png" alt="Fashion Editorial"><div class="wcard-dim"></div><div class="wcard-info"><div class="wcard-info-text">FASHION EDITORIAL</div></div></div>
        <div class="wcard"><img src="3D Artwork.png" alt="3D Artwork"><div class="wcard-dim"></div><div class="wcard-info"><div class="wcard-info-text">3D ARTWORK</div></div></div>
        <div class="wcard"><img src="stylechallenge.png" alt="Style Challenge"><div class="wcard-dim"></div><div class="wcard-info"><div class="wcard-info-text">STYLE CHALLENGE</div></div></div>
        <div class="wcard"><img src="PromotionalContent.png" alt="Promotional Content"><div class="wcard-dim"></div><div class="wcard-info"><div class="wcard-info-text">PROMOTIONAL CONTENT</div></div></div>
      </div>
    </div>
    <div class="work-footer"><p>© 2026 SUMIN PARK ALL RIGHTS RESERVED.</p></div>
  </div>
</section>

/* INTRO SLIDE UP — 스크롤하면 커버 위로 올라와 덮음 */
(function(){
  const intro = document.getElementById('s-intro');
  const coverWrap = document.getElementById('s-cover-wrap');

  function updateIntro(){
    if(!coverWrap || !intro) return;
    const wrapRect = coverWrap.getBoundingClientRect();
    const wrapH = coverWrap.offsetHeight;

    // 커버 wrap 안에서 얼마나 스크롤했는지 (0~1)
    // wrapRect.top: 0이면 커버 상단이 뷰포트 상단
    // wrapRect.top: -wrapH이면 커버가 완전히 지나감
    const scrolled = Math.max(0, Math.min(1, -wrapRect.top / wrapH));

    // intro: 100% 아래에서 시작 → 0% (완전히 올라옴)
    const translateY = (1 - scrolled) * 100;
    intro.style.transform = `translateY(${translateY}%)`;
  }

  window.addEventListener('scroll', updateIntro, {passive:true});
  updateIntro();
})();

/* NAV COLOR */
const nav=document.getElementById('nav');
const introEl=document.getElementById('s-intro');
const workEl=document.getElementById('s-work1');
function updateNav(){
  const sy=window.scrollY+2;
  if(sy>=introEl.offsetTop&&sy<workEl.offsetTop+workEl.offsetHeight)nav.classList.add('light');
  else nav.classList.remove('light');
}
window.addEventListener('scroll',updateNav,{passive:true});updateNav();

/* SCROLL REVEALS */
function watchReveal(trigId,ids){
  const trig=document.getElementById(trigId);
  if(!trig)return;
  const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){ids.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('in');});obs.disconnect();}},{threshold:0.15});
  obs.observe(trig);
}
watchReveal('sinceT',['sinceT','sinceD']);
watchReveal('workT',['workT','workP']);

/* SCROLL CARDS */
const work2=document.getElementById('s-work2');
const cardsTrack=document.getElementById('cardsTrack');
function updateCards(){
  const rect=work2.getBoundingClientRect();
  const totalH=work2.offsetHeight-window.innerHeight;
  const progress=Math.max(0,Math.min(1,-rect.top/totalH));
  const maxShift=Math.max(0,cardsTrack.scrollWidth-window.innerWidth*0.9333);
  cardsTrack.style.transition='none';
  cardsTrack.style.transform=`translateX(-${progress*maxShift}px)`;
}
window.addEventListener('scroll',updateCards,{passive:true});updateCards();

<!-- TRAILING DOT CURSOR + INTRO CIRCLE -->
<script>
(function(){
  const canvas = document.getElementById('sphereCanvas');
  canvas.style.pointerEvents = 'none';
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const BLUE = '27,55,255';
  const MAX  = 24;
  const trail = [];
  let mx = window.innerWidth/2, my = window.innerHeight/2;
  let mouseEntered = false;
  document.addEventListener('mousemove', e => {
    mx=e.clientX; my=e.clientY; mouseEntered=true;
    trail.push({x:mx,y:my,life:1});
    if(trail.length>MAX) trail.shift();
  });

  // ── INTRO: one big blue circle shrinks from fullscreen to center ──
  const INTRO_MS = 1400;
  const t0 = performance.now();
  const CX = window.innerWidth/2, CY = window.innerHeight/2;
  // max radius = diagonal from center to corner
  const MAX_R = Math.sqrt(CX*CX + CY*CY) + 20;

  function easeInOutExpo(t){
    if(t===0) return 0; if(t===1) return 1;
    return t<.5 ? Math.pow(2,20*t-10)/2 : (2-Math.pow(2,-20*t+10))/2;
  }

  function frame(now){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const elapsed = now - t0;
    const introT  = Math.min(1, elapsed / INTRO_MS);
    const introDone = introT >= 1;

    // ── Blue circle shrinking ──
    if(!introDone){
      const eased = easeInOutExpo(introT);
      // radius goes from MAX_R → 0
      const r = MAX_R * (1 - eased);
      // alpha fades out near end
      const alpha = introT < 0.8 ? 1 : 1 - (introT - 0.8)/0.2;
      ctx.beginPath();
      ctx.arc(CX, CY, Math.max(0, r), 0, Math.PI*2);
      ctx.fillStyle = `rgba(${BLUE},${alpha * 0.92})`;
      ctx.fill();
    }

    // ── Trail dots ──
    for(let i=trail.length-1;i>=0;i--){
      trail[i].life-=0.03;
      if(trail[i].life<=0){trail.splice(i,1);continue;}
      const t=i/trail.length;
      const r=5*t*trail[i].life;
      ctx.beginPath();
      ctx.arc(trail[i].x,trail[i].y,Math.max(0,r),0,Math.PI*2);
      ctx.fillStyle=`rgba(${BLUE},${trail[i].life*0.9})`;
      ctx.fill();
    }

    // ── Main cursor dot ──
    if(mouseEntered){
      ctx.beginPath();
      ctx.arc(mx,my,5,0,Math.PI*2);
      ctx.fillStyle=`rgba(${BLUE},1)`;
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
