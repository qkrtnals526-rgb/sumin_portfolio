<meta property="og:type" content="website">

<style>
@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2');font-weight:45 920;font-display:swap}
@font-face{font-family:'StackSansNotch';src:url('StackSansNotch-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-display:swap}

/* ───────── 토큰 ─────────
   포인트: Stack Sans Notch Bold
   기본: Pretendard 400/500/600, 행간 165%, 자간 -1% */
:root{
  --bg:#000;
  --ink:#F2F2F0;
  --sub:#8C8C88;
  --mute:#474745;
  --line:#262625;
  --ph:#121212;
  --ph-line:#2E2E2D;
  --gutter:clamp(18px,3.2vw,56px);
  --maxw:1760px;
  --sans:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --point:'StackSansNotch','Pretendard',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.65;letter-spacing:-.01em;
  background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all}
img,video{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter)}
.pt{font-family:var(--point);font-weight:700;letter-spacing:-.01em;line-height:1}

/* ───────── 상단 바 ───────── */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;height:60px;font-size:15px}
.bar-name{font-size:17px}
.bar-links{display:flex;gap:clamp(18px,2.4vw,36px);font-weight:500}
.bar-links a{color:var(--sub);transition:color .2s}
.bar-links a:hover,.bar-links a[aria-current="true"]{color:var(--ink)}

/* ───────── 홈: 인트로 + 인덱스 ───────── */
.hero{padding-top:clamp(56px,9vw,160px);padding-bottom:clamp(40px,5vw,80px)}
.intro{font-size:clamp(18px,1.7vw,26px);line-height:1.65;font-weight:500;max-width:26em}
.intro span{color:var(--sub)}
.index{margin-top:clamp(40px,6vw,104px);border-bottom:1px solid var(--line)}
.index a{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);
  padding:clamp(14px,1.8vw,28px) 0;color:var(--ink)}
.index .word{display:block;overflow:hidden;padding-bottom:.06em;font-family:var(--point);font-weight:700;
  font-size:clamp(36px,6vw,108px);line-height:1;letter-spacing:-.02em}
.index .word > span{display:inline-block;transition:transform .5s var(--ease),color .3s}
.index a:hover .word > span{transform:translateX(.18em)}
.index:hover a:not(:hover) .word > span{color:var(--mute)}
.idx-meta{display:flex;align-items:center;gap:clamp(12px,2vw,32px)}
.idx-n{font-size:15px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums}
.idx-arrow{width:clamp(36px,3.6vw,56px);aspect-ratio:1;border-radius:50%;border:1px solid currentColor;position:relative;
  opacity:0;transform:scale(.6) rotate(-45deg);transition:opacity .3s,transform .4s var(--ease)}
.idx-arrow::before{content:'';position:absolute;left:28%;right:28%;top:50%;height:1.5px;background:currentColor}
.idx-arrow::after{content:'';position:absolute;right:28%;top:50%;width:22%;aspect-ratio:1;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;transform:translate(0,-50%) rotate(45deg);transform-origin:center}
.index a:hover .idx-arrow,.index a:focus-visible .idx-arrow{opacity:1;transform:none}
@media (hover:none),(pointer:coarse){ .idx-arrow{opacity:1;transform:none} }
@media (prefers-reduced-motion:no-preference){
  .index.first .word > span{transform:translateY(105%);animation:up .9s var(--ease) forwards}
  .index.first a:nth-child(2) .word > span{animation-delay:.07s}.index.first a:nth-child(3) .word > span{animation-delay:.14s}
  .index.first a:nth-child(4) .word > span{animation-delay:.21s}.index.first a:nth-child(5) .word > span{animation-delay:.28s}
}
.hero{padding-bottom:clamp(80px,10vw,180px)}

/* 카테고리 페이지 */
.cat-page{padding-top:clamp(40px,6vw,104px)}
.cat-title{margin-top:clamp(20px,2.4vw,40px);font-size:clamp(44px,7.4vw,132px);letter-spacing:-.02em}
.cat-title .line{display:block;overflow:hidden;padding-bottom:.05em}
.cat-title .line > span{display:block}
@media (prefers-reduced-motion:no-preference){ .cat-title .line > span{transform:translateY(105%);animation:up .9s var(--ease) .05s forwards} }
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:clamp(24px,3vw,48px) calc(var(--gutter) * -1) clamp(40px,5vw,80px);padding:0 var(--gutter)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--sub);white-space:nowrap;transition:border-color .2s,color .2s}
.tab:hover{color:var(--ink);border-color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab sup{font-size:.7em;margin-left:3px}
.cat-next{margin-top:clamp(80px,10vw,180px)}
@keyframes up{to{transform:none}}

/* 인덱스 위에 마우스를 올리면 따라오는 미리보기 */
.peek{position:fixed;left:0;top:0;width:clamp(200px,20vw,320px);z-index:25;pointer-events:none;
  opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .25s,transform .35s var(--ease)}
.peek.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.peek .ph,.peek .media{aspect-ratio:4/3;width:100%;object-fit:cover}

/* ───────── 작업 목록 ───────── */
.group + .group{margin-top:clamp(64px,8vw,140px)}
.group-head{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ink);
  padding-top:12px;margin-bottom:clamp(20px,2.4vw,36px)}
.group-head h2{font-size:clamp(20px,1.8vw,28px)}
.group-head span{color:var(--sub);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.group-note{color:var(--sub);font-size:15px;margin:-10px 0 clamp(20px,2.4vw,36px);max-width:38em}

.cards{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(40px,4.4vw,72px) clamp(12px,1.4vw,24px);align-items:start}
.card{grid-column:span var(--span);display:block;cursor:none}
.card .frame{overflow:hidden;position:relative}
.card .frame > *{aspect-ratio:4/3;width:100%;object-fit:cover;transition:transform .7s var(--ease)}
.card:hover .frame > *{transform:scale(1.03)}
.card-meta{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:15px}
.card-meta b{font-weight:600}
.card-meta span{color:var(--sub);white-space:nowrap}
@media (max-width:1000px){ .cards{grid-template-columns:1fr 1fr} .card{grid-column:auto} }
@media (max-width:640px){ .cards{grid-template-columns:1fr} }
@media (hover:none),(pointer:coarse){ .card{cursor:pointer} }

.reels{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(28px,3vw,48px) clamp(10px,1.2vw,20px)}
.reel{display:block}
.reel .frame{overflow:hidden;position:relative}
.reel .frame > *{aspect-ratio:9/16;width:100%;object-fit:cover}
.reel-meta{margin-top:10px;font-size:14px;line-height:1.5}
.reel-meta b{display:block;font-weight:600}
.reel-meta span{color:var(--sub)}
@media (max-width:1000px){ .reels{grid-template-columns:repeat(3,1fr)} }
@media (max-width:640px){ .reels{grid-template-columns:1fr 1fr} }

/* 카드 위에서 커서를 대신하는 원 */
.cursor{position:fixed;left:0;top:0;z-index:40;pointer-events:none;width:84px;height:84px;border-radius:50%;
  background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--point);font-weight:700;font-size:15px;
  transform:translate(-50%,-50%) scale(0);transition:transform .3s var(--ease)}
.cursor.on{transform:translate(-50%,-50%) scale(1)}
@media (hover:none),(pointer:coarse){ .cursor,.peek{display:none} }

/* ───────── 작업물 자리 (크기 표시) ───────── */
.ph{position:relative;display:block;width:100%;background:var(--ph);outline:1px solid var(--ph-line);outline-offset:-1px;overflow:hidden}
.ph::before,.ph::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top right,transparent calc(50% - .5px),var(--ph-line) 50%,transparent calc(50% + .5px));opacity:.55}
.ph::after{transform:scaleX(-1)}
.ph .size{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;text-align:center;background:var(--ph);padding:6px 10px;line-height:1.25}
.ph .size b{display:block;font-family:var(--point);font-weight:700;font-size:clamp(15px,1.3vw,20px);color:var(--ink)}
.ph .size i{font-style:normal;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.ph .file{position:absolute;left:10px;bottom:8px;right:10px;z-index:1;font-size:11px;color:var(--sub);line-height:1.3;word-break:break-all}
.ph.tiny .size i,.ph.tiny .file{display:none}

/* 스크롤하면 한 번 열리는 이미지 */
@media (prefers-reduced-motion:no-preference){
  .reveal{clip-path:inset(0 0 100% 0);transition:clip-path 1s var(--ease)}
  .reveal.in{clip-path:inset(0 0 0 0)}
}

/* ───────── About ───────── */
.about{border-top:1px solid var(--ink);padding:14px 0 clamp(80px,10vw,180px)}
.about-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(32px,3vw,48px) clamp(12px,1.4vw,24px)}
.about-label{grid-column:span 3;font-size:clamp(20px,1.8vw,28px)}
.about-main{grid-column:4 / span 9}
.about-lead{font-size:clamp(20px,2vw,32px);line-height:1.5;font-weight:500;max-width:22em}
.cv{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(32px,3vw,48px) clamp(12px,1.4vw,24px);margin-top:clamp(48px,6vw,104px)}
.cv h3{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:12px}
.cv li{list-style:none;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.cv li span{display:block;color:var(--sub);font-size:13px}
.mail{display:inline-block;margin-top:clamp(56px,7vw,120px);font-family:var(--point);font-weight:700;
  font-size:clamp(28px,4.6vw,80px);letter-spacing:-.02em;line-height:1.05;position:relative;padding-bottom:6px}
.mail::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:currentColor;transform-origin:left;transition:transform .5s var(--ease)}
.mail:hover::after{transform:scaleX(0);transform-origin:right}
.mail.empty{color:var(--mute);font-family:var(--sans);font-weight:600}
@media (max-width:1000px){ .about-label,.about-main{grid-column:1 / -1} .cv{grid-template-columns:1fr 1fr} }
@media (max-width:640px){ .cv{grid-template-columns:1fr} }

.foot{padding:28px 0 36px;font-size:13px;color:var(--sub)}
.foot .wrap{display:flex;justify-content:space-between;gap:16px}

/* ───────── 프로젝트 상세 ───────── */
.p-top{padding-top:clamp(40px,6vw,104px);padding-bottom:clamp(36px,4vw,72px)}
.crumb{font-size:15px;font-weight:500;color:var(--sub);display:flex;gap:.5em;flex-wrap:wrap}
.crumb a:hover{color:var(--ink)}
.p-title{margin-top:clamp(20px,2.4vw,40px);font-size:clamp(40px,6.4vw,116px);line-height:1.02;letter-spacing:-.02em;max-width:14em}
.p-title.ko{font-family:var(--sans);font-weight:600;line-height:1.2;letter-spacing:-.01em}
.p-title .line{display:block;overflow:hidden;padding-bottom:.05em}
.p-title .line > span{display:block}
@media (prefers-reduced-motion:no-preference){ .p-title .line > span{transform:translateY(105%);animation:up .9s var(--ease) .05s forwards} }
.p-line{margin-top:clamp(16px,1.8vw,28px);font-size:clamp(17px,1.6vw,24px);font-weight:500;color:var(--sub);max-width:28em}
.p-line.todo{color:var(--mute)}
.info{display:grid;grid-template-columns:repeat(5,1fr);gap:0 clamp(12px,1.4vw,24px);margin-top:clamp(40px,5vw,88px)}
.info div{border-top:1px solid var(--ink);padding-top:10px}
.info dt{font-size:13px;color:var(--sub)}
.info dd{font-size:15px;font-weight:500}
.info dd.todo{color:var(--mute);font-weight:400}
@media (max-width:1000px){ .info{grid-template-columns:repeat(3,1fr);row-gap:24px} }
@media (max-width:640px){ .info{grid-template-columns:1fr 1fr} }

.kv{overflow:hidden}
.kv .media,.kv .ph{aspect-ratio:16/9;width:100%;object-fit:cover}
.kv .parallax{will-change:transform}

.p-body{padding:clamp(80px,10vw,180px) 0;display:flex;flex-direction:column;gap:clamp(88px,11vw,200px)}
.sec{display:grid;grid-template-columns:repeat(12,1fr);gap:24px clamp(12px,1.4vw,24px)}
.sec-side{grid-column:span 4}
.sec-side .in{position:sticky;top:88px}
.sec-main{grid-column:5 / span 8;display:flex;flex-direction:column;gap:clamp(10px,1.2vw,20px)}
.sec h2{font-size:clamp(22px,2vw,32px);font-weight:600;line-height:1.3}
.sec-side p{margin-top:12px;color:var(--sub);font-size:15px;max-width:24em}
@media (max-width:1000px){ .sec-side,.sec-main{grid-column:1 / -1} .sec-side .in{position:static} }

.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:clamp(44px,5vw,84px) 1fr;gap:16px;padding:clamp(18px,2vw,28px) 0;border-top:1px solid var(--line)}
.steps li:last-child{border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--point);font-weight:700;font-size:clamp(26px,2.6vw,44px);line-height:1}
.steps h3{font-size:17px;font-weight:600}
.steps p{color:var(--sub);font-size:15px;margin-top:4px;max-width:34em}
.steps p b{color:var(--ink);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:clamp(8px,1vw,16px)}
.grid > *{aspect-ratio:var(--ratio);width:100%;object-fit:cover}
@media (max-width:760px){ .grid{grid-template-columns:repeat(min(var(--cols),2),1fr)} }
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:clamp(20px,2.4vw,40px) clamp(8px,1vw,16px)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,.5vw,8px)}
.pair > *{aspect-ratio:3/4;width:100%;object-fit:cover}
.full > *{aspect-ratio:var(--ratio);width:100%;object-fit:cover}
.phones{display:flex;gap:clamp(10px,1.2vw,20px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.phones > *{flex:0 0 clamp(170px,19vw,260px);aspect-ratio:1058/2980;scroll-snap-align:start;object-fit:cover}
.empty-note{grid-column:5 / span 8;color:var(--sub);font-size:15px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:1000px){ .empty-note{grid-column:1 / -1} }

.next{display:block;border-top:1px solid var(--ink);padding:14px 0 clamp(64px,8vw,140px);cursor:none}
.next small{font-size:15px;font-weight:500;color:var(--sub)}
.next-row{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-top:clamp(20px,3vw,48px)}
.next strong{font-size:clamp(34px,5.4vw,100px);line-height:1.02;letter-spacing:-.02em}
.next strong.ko{font-family:var(--sans);font-weight:600;line-height:1.2}
.next-thumb{width:clamp(120px,18vw,300px);overflow:hidden}
.next-thumb > *{aspect-ratio:4/3;width:100%;object-fit:cover;transition:transform .7s var(--ease)}
.next:hover .next-thumb > *{transform:scale(1.06)}
@media (max-width:640px){ .next-row{grid-template-columns:1fr} .next-thumb{width:100%} }
@media (hover:none),(pointer:coarse){ .next{cursor:pointer} }


/* ───────── 표지: 누를 때마다 이름이 한 글자씩 ───────── */
.cover{position:relative;height:100svh;min-height:520px;background:#000;color:#fff;overflow:hidden;
  margin-top:-60px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cover-type{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 76px) var(--gutter) calc(env(safe-area-inset-bottom,0px) + 64px);pointer-events:none}
.cover-line{font-family:var(--point);font-weight:700;font-size:min(22vw,21svh);line-height:.86;letter-spacing:-.03em;
  display:flex;align-items:flex-end;min-height:.86em;white-space:nowrap}
.cover-line .ch{display:inline-block;animation:pop .42s var(--ease) both}
.cover-line .caret{display:inline-block;width:.08em;height:.72em;background:#fff;margin-left:.06em;margin-bottom:.08em;animation:blink 1s steps(1) infinite}
@keyframes pop{from{transform:translateY(.18em) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{50%{opacity:0}}
.cover-ui{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:3;display:flex;justify-content:space-between;align-items:center;
  padding:0 var(--gutter);font-size:13px;color:rgba(255,255,255,.55)}
.press{font:inherit;font-weight:500;color:#fff;background:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 16px;cursor:pointer;transition:background .2s,color .2s}
.press:hover{background:#fff;color:#000}
.cover-count{font-family:var(--point);font-weight:700;font-variant-numeric:tabular-nums;min-width:4ch}
.cover-meta{opacity:0;transition:opacity .5s}
.cover.done .cover-meta{opacity:1}
.bar.on-dark{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fff}
.bar.on-dark .bar-links a{color:rgba(255,255,255,.6)}
.bar.on-dark .bar-links a:hover,.bar.on-dark .bar-links a[aria-current="true"]{color:#fff}
.bar{transition:background .3s,color .3s}
@media (max-width:640px){ .cover-meta{display:none} }


.keyart{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none}
.keyart-tilt{position:relative;width:min(64vw,78svh,820px);aspect-ratio:1;margin-top:2svh;opacity:0;transition:opacity .6s}
.keyart.ready .keyart-tilt{opacity:1}
.k-frame{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
@media (max-width:640px){ .keyart-tilt{width:min(104vw,62svh)} }

/* 페이지 이동 시 덮었다 걷히는 면 */
.wipe{position:fixed;inset:0;z-index:50;background:#1b1b1b;transform:translateY(100%);pointer-events:none;visibility:hidden}
.wipe.cover,.wipe.leave{visibility:visible}
.wipe.cover{transition:transform .45s var(--ease);transform:translateY(0)}
.wipe.leave{transition:transform .55s var(--ease);transform:translateY(-100%)}

@media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition:none!important;animation:none!important} .wipe{display:none} }

/* 작업물 한 칸. ratio 예: '4/3' */
function media(label, ratio, extra=''){
  const file = /\.(png|jpe?g|webp|gif|mp4|webm)$/i.test(label||'');
  if (SHOW_MEDIA && file){
    return /\.(mp4|webm)$/i.test(label)
      ? `<video class="media ${extra}" src="${esc(label)}" autoplay muted loop playsinline></video>`
      : `<img class="media ${extra}" src="${esc(label)}" alt="" loading="lazy">`;
  }
  const r = (ratio||'').replace('/',' : ');
  return `<span class="ph ${extra}" data-ratio="${esc(r)}"><span class="size"><b>${esc(r)}</b><i></i></span><span class="file">${esc(label)}</span></span>`;
}

/* 빈 칸마다 지금 화면에서의 실제 크기(px)를 적어줌 */
const sizer = new ResizeObserver(list => list.forEach(e => {
  const w = Math.round(e.contentRect.width), h = Math.round(e.contentRect.height);
  const i = e.target.querySelector('.size i'); if (i) i.textContent = `${w} × ${h}px`;
  e.target.classList.toggle('tiny', w < 120);
}));
const revealer = new IntersectionObserver(list => list.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add('in'); revealer.unobserve(e.target); }
}), { rootMargin:'0px 0px -8% 0px' });
function wire(){
  document.querySelectorAll('.ph').forEach(el => sizer.observe(el));
  document.querySelectorAll('.reveal').forEach(el => revealer.observe(el));
}

/* 줄마다 7:5, 4:4:4, 5:7… 로 너비를 바꿔 배치 (한 칸만 남지 않게) */
function layout(n){
  const twos = [[7,5],[5,7],[6,6]], out = [];
  let left = n, k = 0, turn = 0;
  while (left > 0){
    const size = left <= 3 ? left : left === 4 ? 2 : (turn++ % 2 ? 3 : 2);
    const row = size === 1 ? [6] : size === 3 ? [4,4,4] : twos[k++ % twos.length];
    out.push(...row); left -= size;
  }
  return out;
}

/* ════════════════ 상세 ════════════════ */
function renderBlock(b){
  const m = (x, r) => media(x, r, 'reveal');
  switch(b.type){
    case 'grid':   return `<div class="grid" style="--cols:${b.cols};--ratio:${b.ratio}">${b.items.map(x => m(x,b.ratio)).join('')}</div>`;
    case 'pairs':  return `<div class="pairs">${b.items.map(([x,y]) => `<div class="pair">${m(x,'3/4')}${m(y,'3/4')}</div>`).join('')}</div>`;
    case 'full':   return `<div class="full" style="--ratio:${b.ratio}">${m(b.src,b.ratio)}</div>`;
    case 'phones': return `<div class="phones">${b.items.map(x => media(x,'1058/2980')).join('')}</div>`;
    default: return '';
  }
}

function splitTitle(t){
  /* 긴 라틴 제목은 두 줄로 나눠 한 줄씩 올라오게 */
  if (hasKo(t) || t.length < 16) return `<span class="line"><span>${esc(t)}</span></span>`;
  const w = t.split(' '), half = Math.ceil(w.length/2);
  return [w.slice(0,half).join(' '), w.slice(half).join(' ')].map(l => `<span class="line"><span>${esc(l)}</span></span>`).join('');
}

/* ════════════════ 인터랙션 ════════════════ */
/* 1) 카드와 '다음 작업' 위에서 View 원형 커서 */
const cursor = document.querySelector('.cursor');
let mx = innerWidth/2, my = innerHeight/2, cx = mx, cy = my;
if (fine){
  addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.classList.toggle('on', !!e.target.closest('.card, .next'));
  });
}

/* 2) 분류 이름 위에서 해당 카테고리 첫 작업 미리보기 */
const peek = document.querySelector('.peek');
let px = mx, py = my;
function wirePeek(){
  if (!fine) return;
  document.querySelectorAll('.index a').forEach(a => {
    a.addEventListener('pointerenter', () => {
      const c = CATEGORIES.find(x => x.id === a.dataset.f);
      const label = !c ? PROJECTS.clearance.thumb : c.reels ? c.items[0].thumb : PROJECTS[c.projects[0]].thumb;
      peek.innerHTML = media(label, '4/3'); sizer.observe(peek.firstElementChild);
      peek.classList.add('on');
    });
    a.addEventListener('pointerleave', () => peek.classList.remove('on'));
  });
}

/* 3) KV가 스크롤에 맞춰 살짝 늦게 움직임 */
function tick(){
  cx += (mx - cx) * .22; cy += (my - cy) * .22;
  px += (mx - px) * .12; py += (my - py) * .12;
  cursor.style.left = cx + 'px'; cursor.style.top = cy + 'px';
  peek.style.left = px + 'px'; peek.style.top = py + 'px';
  const kv = document.querySelector('.kv .parallax');
  if (kv && !calm){
    const r = kv.parentElement.getBoundingClientRect();
    if (r.bottom > 0 && r.top < innerHeight) kv.style.transform = `translateY(${(-r.top * .18).toFixed(1)}px) scale(1.08)`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);


/* ════════════════ 표지: 영상 프레임 키캡 ════════════════
   회전 영상(121장)과 누르는 영상(14장)을 프레임 이미지로 쪼개 캔버스에 그립니다.
   평소엔 정면에서 둥둥 떠 있고, 누르면 눌립니다. */
const KEY_FRAMES = {
  rot:   ['key/rot/000.webp'],   /* 정면 한 장만 사용 */
  press: Array.from({length:14},  (_,i) => `key/press/${String(i).padStart(2,'0')}.webp`),
  pressBottom: 5,     /* 가장 깊이 눌린 프레임 — 이 순간 글자가 찍힘 */
};

let coverCtl = null;
function startCover(){
  coverCtl && coverCtl.destroy();
  const el = document.getElementById('cover'); if (!el) return;
  const top = document.getElementById('lineTop'), bot = document.getElementById('lineBot');
  const count = document.getElementById('coverCount'), btn = document.getElementById('pressBtn');
  const WORDS = ['PARK','SUMiN'], TOTAL = WORDS.join('').length;
  let typed = 0;

  const art = document.createElement('div');
  art.className = 'keyart';
  art.innerHTML = `<div class="keyart-tilt"><img class="k-frame" src="${KEY_FRAMES.rot[0]}" alt="" draggable="false"></div>`;
  el.insertBefore(art, el.querySelector('.cover-ui'));
  const box = art.querySelector('.keyart-tilt'), frameEl = art.querySelector('.k-frame');
  /* 첫 장은 바로 보이게 (다른 프레임은 뒤에서 불러옴) */
  frameEl.onload = () => art.classList.add('ready');
  if (frameEl.complete && frameEl.naturalWidth) art.classList.add('ready');

  function paint(added){
    const a = Math.min(typed, WORDS[0].length), b = Math.max(0, typed - WORDS[0].length);
    const letters = (w, n, fresh) => [...w.slice(0,n)].map((c,i) => `<span class="ch" style="${fresh && i===n-1 ? '' : 'animation:none'}">${c}</span>`).join('');
    const caret = '<span class="caret"></span>';
    top.innerHTML = letters(WORDS[0], a, added && b===0) + (typed < WORDS[0].length ? caret : '');
    bot.innerHTML = letters(WORDS[1], b, added && b>0) + (typed >= WORDS[0].length && typed < TOTAL ? caret : '');
    count.textContent = `${typed}/${TOTAL}`;
    el.classList.toggle('done', typed === TOTAL);
    btn.textContent = typed === TOTAL ? '한 번 더 누르면 처음부터' : typed ? '계속 누르기' : '키를 눌러 이름 완성하기';
  }
  paint(false);

  let ac;
  function clack(){
    try{
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = ac.currentTime;
      const buf = ac.createBuffer(1, ac.sampleRate * .03, ac.sampleRate), d = buf.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 3);
      const n = ac.createBufferSource(); n.buffer = buf;
      const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=3200; f.Q.value=.8;
      const g = ac.createGain(); g.gain.value = .28;
      n.connect(f).connect(g).connect(ac.destination); n.start(t0);
      const o = ac.createOscillator(), og = ac.createGain();
      o.frequency.setValueAtTime(190,t0); o.frequency.exponentialRampToValueAtTime(70,t0+.07);
      og.gain.setValueAtTime(.18,t0); og.gain.exponentialRampToValueAtTime(.001,t0+.08);
      o.connect(og).connect(ac.destination); o.start(t0); o.stop(t0+.09);
    }catch(e){}
  }
  function typeOne(){ typed = typed >= TOTAL ? 1 : typed + 1; paint(true); clack(); }

  /* 프레임 불러오기 */
  const load = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  let rot = [], prs = [], ready = false;
  const N = KEY_FRAMES.rot.length;
  Promise.all(KEY_FRAMES.rot.map(load)).then(a => { rot = a; return Promise.all(KEY_FRAMES.press.map(load)); })
    .then(a => { prs = a; ready = true; art.classList.add('ready'); })
    .catch(() => { ready = true; art.classList.add('ready'); });

  function size(){
    const w = box.clientWidth, dpr = Math.min(devicePixelRatio || 1, 2);
    const px = Math.min(Math.round(w * dpr), 720);
    /* img 방식이라 캔버스 크기 조정 불필요 */
  }
  size(); addEventListener('resize', size);

  let shown = null;
  function draw(img){ if (!img || img === shown) return; shown = img; frameEl.src = img.src; }
  /* 클릭 판정용: 현재 프레임의 투명도를 작은 캔버스에서 확인 (실패하면 네모 영역으로 판정) */
  const probe = document.createElement('canvas'); probe.width = probe.height = 180;
  let pctx = null; try { pctx = probe.getContext('2d'); } catch(e){}

  /* 상태: idle(천천히 회전) → seek(정면으로 복귀) → press(눌림) */
  let mode = 'idle', pos = 0, speed = 0, pending = 0;
  let seekFrom = 0, seekTo = 0, seekT = 0, seekDur = .3, pressT = 0, stamped = false;
  const PRESS_FPS = 40;
  let tx = 0, ty = 0, moved = false;

  function requestPress(){
    pending++;
    if (mode === 'idle') startSeek();
  }
  function startSeek(){
    const p = ((pos % N) + N) % N;
    const d = p > N/2 ? N - p : -p;            /* 가까운 쪽으로 정면(0)까지 */
    if (Math.abs(d) < .6 || calm){ pos = 0; return startPress(); }
    mode = 'seek'; seekFrom = pos; seekTo = pos + d; seekT = 0;
    seekDur = Math.min(.42, .1 + Math.abs(d) / N * 1.1);
  }
  function startPress(){ mode = 'press'; pressT = 0; stamped = false; pending--; }

  btn.addEventListener('click', e => { e.stopPropagation(); requestPress(); });

  function onKey(e){
    const r = frameEl.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x < 0 || y < 0 || x > 1 || y > 1) return false;
    if (!ready) return true;
    try{
      pctx.clearRect(0,0,180,180); pctx.drawImage(shown || rot[0], 0, 0, 180, 180);
      return pctx.getImageData(Math.floor(x*180), Math.floor(y*180), 1, 1).data[3] > 40;
    }catch(err){ return x > .12 && x < .88 && y > .05 && y < .95; }
  }
  const onMove = e => {
    const r = el.getBoundingClientRect();
    tx = (e.clientX - r.left)/r.width - .5; ty = (e.clientY - r.top)/r.height - .5;
    if (e.pointerType === 'mouse') moved = true;
    art.classList.toggle('hot', onKey(e));
  };
  const onDown = e => { if (e.target.closest('.press')) return; if (onKey(e)) requestPress(); };
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerdown', onDown);

  let visible = true, raf, last = performance.now();
  const vis = new IntersectionObserver(([e]) => {
    visible = e.isIntersecting;
    document.querySelector('.bar').classList.toggle('on-dark', e.intersectionRatio > .12);
    if (visible && !raf){ last = performance.now(); loop(); }
  }, { threshold:[0,.12,.5] });
  vis.observe(el);

  const easeOut = x => 1 - Math.pow(1 - x, 3);
  function loop(){
    if (!visible){ raf = null; return; }
    const now = performance.now(), dt = Math.min((now - last) / 1000, .05); last = now;
    if (ready){
      if (mode === 'idle'){
        /* 정면 고정, 공중에서 둥둥 떠 있기만 함 */
        const t = now / 1000;
        pos = 0;
        const oy = calm ? 0 : Math.sin(t * 1.1) * .6;
        box.style.transform = `translate3d(0, ${oy.toFixed(2)}%, 0)`;
      } else if (mode === 'seek'){
        seekT += dt / seekDur;
        pos = seekFrom + (seekTo - seekFrom) * easeOut(Math.min(seekT, 1));
        if (seekT >= 1){ pos = 0; startPress(); }
      }
      if (mode === 'press'){
        pressT += dt * PRESS_FPS;
        const i = Math.min(Math.floor(pressT), prs.length - 1);
        draw(prs[i]);
        if (!stamped && i >= KEY_FRAMES.pressBottom){ stamped = true; typeOne(); }
        if (pressT >= prs.length){
          pos = 0; speed = 0;
          if (pending > 0) startPress(); else mode = 'idle';
        }
      } else {
        const p = ((pos % N) + N) % N, i0 = Math.floor(p), f = p - i0;
        draw(rot[i0]);
      }
    }
    raf = requestAnimationFrame(loop);
  }
  loop();

  coverCtl = { destroy(){
    cancelAnimationFrame(raf); raf = null; visible = false; vis.disconnect();
    removeEventListener('resize', size);
    document.querySelector('.bar').classList.remove('on-dark');
    coverCtl = null;
  }};
}

/* ════════════════ 라우팅 (+ 프로젝트로 갈 때 화면을 덮었다 걷기) ════════════════ */
const wipe = document.querySelector('.wipe');
function go(){
  const h = location.hash.replace(/^#\/?/, '');
  const [kind, id] = h.split('/');
  cursor.classList.remove('on'); peek.classList.remove('on');
  document.querySelectorAll('[data-nav]').forEach(a => a.setAttribute('aria-current','false'));
  const sub = (kind === 'project') || (kind === 'work' && id);
  if (sub){
    coverCtl && coverCtl.destroy();
    kind === 'project' ? renderProject(id) : renderCategory(id);
    document.querySelector('[data-nav="work"]').setAttribute('aria-current','true');
    window.scrollTo(0,0); return;
  }
  const fresh = !document.querySelector('.index');
  renderHome();
  if (kind === 'about'){
    document.querySelector('[data-nav="about"]').setAttribute('aria-current','true');
    document.getElementById('about').scrollIntoView();
  } else if (kind === 'work'){
    document.querySelector('[data-nav="work"]').setAttribute('aria-current','true');
    document.getElementById('work').scrollIntoView();
  } else if (fresh) window.scrollTo(0,0);
}
function route(){
  const toSub = /^#\/(project\/|work\/[\w-])/.test(location.hash);
  const onSub = !document.querySelector('.index') && $app.innerHTML;
  if (calm || !(toSub || onSub)) return go();
  wipe.className = 'wipe cover';
  setTimeout(() => {
    go();
    wipe.className = 'wipe leave';
    setTimeout(() => { wipe.className = 'wipe'; }, 600);
  }, 450);
}
addEventListener('hashchange', route);
go();
</script>
